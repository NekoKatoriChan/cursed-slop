<script>

[23,52,83].forEach(i=>m.sp[i-1]=1);[12,50,74].forEach(i=>m.sp[i-1]=2);for(let i=75;i<=80;i++)m.sl[i-1]=1;for(let i=55;i<=60;i++)m.sl[i-1]=1;return m}
function def(h=.7){let m;for(let t=0;t<60;t++){m=mk(10,20);const L=199,H=160,u=new Set([0,L]),R=Math.random,pk=(a,b)=>{for(let k=0;k<60;k++){const i=a+(R()*(b-a+1)|0);if(!u.has(i)){u.add(i);return i}}return-1},ad=(A,a,b)=>{if(a>0&&b>=0)A.push([a,b])};for(let k=0;k<18;k++){const a=pk(3,H-1);ad(m.la,a,Math.min(L,a+6+(R()*30|0)))}for(let k=0;k<6;k++){const a=pk(12,H-1);ad(m.sn,a,Math.max(0,a-5-(R()*35|0)))}const hs=1+Math.round(h*4);for(let k=0;k<hs;k++){const a=pk(H,L-1);ad(m.sn,a,Math.max(0,a-(10+(R()*(25+h*25)|0))))}for(let k=0;k<3;k++)ad(m.po,pk(5,H-1),pk(5,H-1));ad(m.po,pk(H,L-12),pk(L-6,L-1));for(const[v,c]of[[1,4],[2,6],[3,7]])for(let k=0;k<c;k++){const i=pk(5,L-1);if(i>0)m.sp[i]=v}for(let k=0;k<3;k++){const a=pk(5,H-6);if(a>0)for(let j=0;j<3;j++)m.sl[a+j]=1}for(let i=H;i<L;i++)if(R()<h*.15)m.sl[i]=1;M=m;if(!val().length)return m}M=m;return m}

/* ---------- engine ---------- */
const CH=[['dd','Xúc xắc cuồng: nhân đôi bước','Xúc xắc'],['db','Xúc xắc ngược: đi lùi','Xúc xắc'],['mg','Rắn di cư mỗi 8 lượt','Bàn cờ'],['s0','Hoán đổi vị trí vòng tròn','Bão (mỗi 15 lượt)'],['s1','Gió xuôi: mọi người +3 ô','Bão (mỗi 15 lượt)'],['s2','Dịch chuyển vùng giảm tốc','Bão (mỗi 15 lượt)'],['s3','Mọi người nhận 2 vàng','Bão (mỗi 15 lượt)'],['e0','+5 vàng','Ô sự kiện ?'],['e1','Lùi 7 ô','Ô sự kiện ?'],['e2','Đổi chỗ với người dẫn đầu','Ô sự kiện ?'],['e3','Mất 3 vàng','Ô sự kiện ?'],['e4','Lượt sau tung 3 xúc xắc','Ô sự kiện ?'],['e5','Hố đen: văng tới ô ngẫu nhiên','Ô sự kiện ?'],['e6','Đổi chỗ với người ngẫu nhiên','Ô sự kiện ?'],['e7','Vụ nổ: người gần bị lùi 4 ô','Ô sự kiện ?']];
